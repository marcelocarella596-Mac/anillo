<script>
let live={hr:78,spo2:96,sys:134,dia:92,steps:907,kcal:38,temp:36.5,sleep:"4h 20m",bat:78};

async function conectarTodo(){
  try{
    const dev = await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'R10M'},{namePrefix:'R10'}],
      optionalServices:[0x180D,0x180F,0xFF00,0xFF01,0xFF02]
    });
    document.getElementById('connTxt').textContent = dev.name+" • Conectado";
    const server = await dev.gatt.connect();

    // 1. HR ESTÁNDAR
    try{
      const hrSvc = await server.getPrimaryService(0x180D);
      const hrChar = await hrSvc.getCharacteristic(0x2A37);
      await hrChar.startNotifications();
      hrChar.addEventListener('characteristicvaluechanged',e=>{
        live.hr = e.target.value.getUint8(1); updateAll();
      });
    }catch(e){}

    // 2. SERVICIO PROPIETARIO FF00 - LEE TODO
    const ffSvc = await server.getPrimaryService(0xFF00);
    const notifyChar = await ffSvc.getCharacteristic(0xFF01);
    const writeChar = await ffSvc.getCharacteristic(0xFF02);
    await notifyChar.startNotifications();

    notifyChar.addEventListener('characteristicvaluechanged',e=>{
      const data = new Uint8Array(e.target.value.buffer);
      console.log('R10M RAW:',data);
      // Protocolo típico R10M: [CMD,LEN,DATA...,SUM]
      // Acá parseamos según lo que manda tu anillo 5E17
      if(data.length>=5){
        let cmd=data[0];
        if(cmd==0x21){ // Heart
          live.hr=data[2];
        }else if(cmd==0x22){ // SpO2
          live.spo2=data[2];
        }else if(cmd==0x23){ // BP
          live.sys=data[2]; live.dia=data[3];
        }else if(cmd==0x24){ // Steps
          live.steps = (data[2]<<16)|(data[3]<<8)|data[4];
        }else if(cmd==0x25){ // Temp
          live.temp = data[2]+data[3]/10;
        }
        updateAll();
      }
    });

    // Pide datos al anillo - comandos de solicitud
    const send = (cmd)=>{
      let pkt=new Uint8Array([cmd,0x01,0x00,0x00]);
      pkt[3]=(cmd+1)&0xFF;
      return writeChar.writeValue(pkt);
    };
    await send(0x21); setTimeout(()=>send(0x22),300);
    setTimeout(()=>send(0x23),600); setTimeout(()=>send(0x24),900);

    document.getElementById('batTxt').textContent = "Batería "+live.bat+"% • LIVE";

  }catch(err){ alert("Activa Bluetooth, selecciona R10M 5E17. Usa Chrome en Android"); console.error(err); }
}

function updateAll(){
  document.getElementById('gHR').textContent=live.hr+" BPM";
  document.getElementById('gSpO2').textContent=live.spo2+"%";
  document.getElementById('gSteps').textContent=live.steps.toLocaleString();
  document.getElementById('gTemp').textContent=live.temp+"°C";
  // Actualiza todas las pantallas a la vez
  ['cHR','fHR'].forEach(id=>{let el=document.getElementById(id);if(el)el.textContent=live.hr+" BPM"});
  ['rSpO2'].forEach(id=>{let el=document.getElementById(id);if(el)el.textContent=live.spo2+"%"});
  ['fSteps'].forEach(id=>{let el=document.getElementById(id);if(el)el.textContent=live.steps.toLocaleString()});
}
                                  </script>
