<!doctype html>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>MAR Dark</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Inter,system-ui}
body{background:#0a0a0a;color:#fff;padding-bottom:90px}
.top{margin:14px 16px;background:#151515;border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:18px;font-weight:900}
.badge{background:#c7f0c7;color:#0a5a0a;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
.scores{display:flex;gap:12px;padding:20px 16px;justify-content:space-between}
.sc{width:108px;height:108px;border-radius:50%;background:#121212;border:4px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc b{font-size:32px;font-weight:900}
.sc.s1{border-color:#7ed17e}.sc.s2{border-color:#4ecdc4}.sc.s3{border-color:#ff9a57}
.hero{margin:0 16px;background:#151515;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}
.circ{width:86px;height:86px;border-radius:50%;background:conic-gradient(#ff9a57 47.1%,#2a2a2a 0);display:grid;place-items:center}
.ci{width:68px;height:68px;background:#0a0a0a;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grid{margin:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#151515;border-radius:16px;padding:14px}
.k{font-size:10px;color:#888;font-weight:700}.v{font-size:20px;font-weight:800}.s{font-size:11px;color:#aaa}
.devol{margin:14px 16px;background:#f6f5f2;color:#111;border-radius:20px;padding:16px}
</style>
<div class=top><h1>MAR • R10M 5E17</h1><div class=badge>● CONECTADO</div></div>
<div class=scores>
<div><div class="sc s1"><b>82</b></div><div style="color:#7ed17e;text-align:center;font-size:11px">DESCANSO Bueno</div></div>
<div><div class="sc s2"><b>85</b></div><div style="color:#4ecdc4;text-align:center;font-size:11px">SUEÑO 08h15</div></div>
<div><div class="sc s3"><b>47</b></div><div style="color:#ff9a57;text-align:center;font-size:11px">4712 pasos</div></div>
</div>
<div class=hero><div class=circ><div class=ci><b>4712</b></div></div><div><b>4,712 de 10,000</b><div style="font-size:12px;color:#888">191 kcal • 2.99 km • 47.1%</div></div></div>
<div class=grid>
<div class=card><div class=k>SUEÑO 08H15M</div><div class=v>85</div><div class=s>Profundo 2h01 24%<br>REM 1h19</div></div>
<div class=card><div class=k>RITMO 80 BPM</div><div class=v>80 bpm</div><div class=s>Rango 71-91 • HRV 48ms</div></div>
<div class=card><div class=k>PRESIÓN</div><div class=v>124/83</div><div class=s>Prom 124/81 estable</div></div>
<div class=card><div class=k>OXÍGENO</div><div class=v>98%</div><div class=s>Avg 97% • Noche 99%</div></div>
</div>
<div class=devol id=dev></div>
<script>
document.getElementById('dev').innerHTML=`<h3>DEVOLUCIÓN AUTOMÁTICA • MAR</h3>
● Actividad 47% Proyectas 8.9k hoy<br>
● Sueño 08h15 Excelente Profundo 24% REM 1h19<br>

</script>
