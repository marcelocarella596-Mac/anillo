<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FITRING / MAR v10 • REAL DATA ARCHITECTURE</title>

<style>
:root{
  --bg:#060a14;
  --panel:#0f1629;
  --card:#141e36;
  --line:#1e2f55;
  --blue:#4da3ff;
  --green:#5dff8a;
  --orange:#ff9f43;
  --red:#ff6b6b;
  --yellow:#ffd166;
  --purple:#8b5cf6;
  --cyan:#4ecdc4;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:#c8d3e8;
  font-family:system-ui,-apple-system,Arial,sans-serif;
  font-size:12px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  background:#090f20;
  border-bottom:1px solid var(--line);
  gap:10px;
}

.grid{
  display:grid;
  grid-template-columns:240px minmax(0,1fr) 240px;
  gap:12px;
  padding:12px;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .header{flex-wrap:wrap}
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}

.user{
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
  border:1px solid var(--line);
}

.user.online{
  border-color:var(--blue);
  background:#132040;
}

.user.alert{
  border-color:var(--red);
  background:#2a1414;
}

.user.low{
  border-color:var(--yellow);
  background:#2a2414;
}

.barH{
  height:4px;
  background:#0a1430;
  border-radius:4px;
  margin-top:6px;
  overflow:hidden;
}

.barH div{height:100%}

.row{
  display:grid;
  grid-template-columns:95px 1fr 105px;
  align-items:center;
  gap:8px;
  margin:9px 0;
}

.bar{
  height:5px;
  background:#0a1430;
  border-radius:4px;
  overflow:hidden;
}

.bar div{
  height:100%;
  transition:width .4s;
}

.metricValue{
  text-align:right;
  font-weight:800;
}

.btn{
  padding:8px 10px;
  border-radius:8px;
  border:0;
  font-weight:800;
  cursor:pointer;
  font-size:11px;
}

.btnBlue{
  background:#0a84ff;
  color:#fff;
}

.btnGhost{
  background:#1a2642;
  color:#8aa0c8;
  border:1px solid var(--line);
}

.live{
  font-size:9px;
  color:var(--green);
}

.mode{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
  cursor:pointer;
  background:#0c1429;
}

.dot{
  width:7px;
  height:7px;
  background:#22c55e;
  border-radius:50%;
  display:inline-block;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.3}
}

.take{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin:8px 0;
}

.take button{
  padding:8px 2px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#141e36;
  color:#fff;
  font-size:9px;
  font-weight:800;
  cursor:pointer;
}

.take button.active{
  border-color:var(--green);
  box-shadow:0 0 0 1px var(--green) inset;
}

.source{
  display:inline-block;
  margin-left:4px;
  padding:2px 5px;
  border-radius:5px;
  font-size:7px
