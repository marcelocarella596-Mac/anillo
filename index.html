<!-- FITRING / MAR v14.8 RAW RECORDER PATCH
PEGAR INMEDIATAMENTE ANTES DE </body> EN TU v14.7 ACTUAL.
No cambia el discovery/conexión YCBT que ya funciona. -->
<script>
const FITRING_VERSION='14.8';
let rawSession={app:'FITRING / MAR v14.8',sessionStarted:new Date().toISOString(),events:[],markers:[],tests:[]};
let rawRecording=true,activeRawTest=null;

function rawPush(kind,data={}){
 if(!rawRecording&&kind!=='MARKER')return;
 rawSession.events.push({seq:rawSession.events.length+1,at:new Date().toISOString(),ms:performance.now(),kind,test:activeRawTest?.name||null,...data});
 if(rawSession.events.length>50000)rawSession.events.splice(0,5000);
}
function rawMark(label,value=''){
 const m={at:new Date().toISOString(),label:String(label||''),value:String(value??'')};
 rawSession.markers.push(m);rawPush('MARKER',m);
 const l=document.getElementById('blelog');if(l){l.textContent+=`MARK ${m.label}${m.value?' = '+m.value:''}\n`;l.scrollTop=l.scrollHeight}
}
function promptRawMarker(){
 const label=prompt('Marcador (ej. PASOS_INICIO, PASOS_FIN, SPO2_RESULTADO, PRESION_RESULTADO):');if(!label)return;
 const value=prompt('Valor opcional (ej. 7301, 98, 124/82):')??'';rawMark(label,value);
}
function startRawTest(name){
 activeRawTest={name:String(name||'test'),started:new Date().toISOString(),startSeq:rawSession.events.length+1};
 rawSession.tests.push(activeRawTest);rawPush('TEST_START',{name:activeRawTest.name});
}
function stopRawTest(){
 if(!activeRawTest)return;rawPush('TEST_END',{name:activeRawTest.name});
 activeRawTest.ended=new Date().toISOString();activeRawTest.endSeq=rawSession.events.length;activeRawTest=null;
}
function clearRawSession(){
 if(!confirm('¿Limpiar la captura RAW de esta sesión?'))return;
 rawSession.events=[];rawSession.markers=[];rawSession.tests=[];rawSession.sessionStarted=new Date().toISOString();activeRawTest=null;
 document.getElementById('protocolState').textContent='RAW Recorder limpio · registrando nueva sesión.';
}

function exportProtocolLog(){
 const payload={
  app:'FITRING / MAR v14.8',exportedAt:new Date().toISOString(),sessionStarted:rawSession.sessionStarted,
  device:{name:yDev?.name||bleDeviceName||null,id:yDev?.id||null,connected:!!(yDev?.gatt?.connected&&yCmd),firmware:bleFirmware||null,battery:bleBattery},
  recorder:{recording:rawRecording,totalEvents:rawSession.events.length,markers:rawSession.markers,tests:rawSession.tests,events:rawSession.events},
  protocolCapture,latest:{...S.latest},autoScan:{...S.autoScan}
 };
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=`fitring-v14.8-raw-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 document.getElementById('protocolState').textContent=`RAW exportado · ${rawSession.events.length} eventos · ${rawSession.markers.length} marcadores.`;
}

ysend=async function(t,c,p=[]){
 if(!yCmd)throw Error('R10M YCBT no conectado');
 const f=yframe(t,c,p);protocolNote('TX',f,'CMD');
 rawPush('TX',{source:'CMD',type:t,cmd:c,payload:yhex(p),hex:yhex(f),bytes:[...f]});
 const log=document.getElementById('blelog');if(log){log.textContent+='TX '+yhex(f)+'\n';log.scrollTop=log.scrollHeight}
 await yCmd.writeValue(f);
};

yingest=function(v,src){
 const a=new Uint8Array(v.buffer.slice(v.byteOffset,v.byteOffset+v.byteLength));
 protocolNote('RX',a,src);rawPush('RX',{source:src,hex:yhex(a),bytes:[...a]});
 const log=document.getElementById('blelog');if(log){log.textContent+='RX '+src+' '+yhex(a)+'\n';log.scrollTop=log.scrollHeight}
 const b=src==='CMD'?yCmdBuf:yStreamBuf;b.push(...a);
 while(b.length>=4){const len=b[2]|(b[3]<<8);if(len<6||len>4096){b.shift();continue}if(b.length<len)break;ydecode(b.splice(0,len),src)}
};

ydecode=function(f,src){
 const type=f[0],c=f[1],p=f.slice(4,-2),d={};
 rawPush('DECODE',{source:src,type,cmd:c,payload:yhex(p),frame:yhex(f),payloadBytes:[...p]});
 const lg=document.getElementById('blelog');if(lg){lg.textContent+=`DECODE ${src} type=0x${type.toString(16)} cmd=0x${c.toString(16)} payload=[${yhex(p)}]\n`;lg.scrollTop=lg.scrollHeight}
 if(type===6&&c===1&&p[0])d.hr=p[0];
 if(type===6&&c===2&&p[0])d.spo2=p[0];
 if(type===6&&c===3){if(p[0]&&p[1]){d.sys=p[0];d.dia=p[1]}if(p[2])d.hr=p[2];if(p[3])d.hrv=p[3]}
 if(type===4&&c===0x13&&p.length>=3){const m=p[0],v=p[2],fr=p[3]||0;if(m===0&&v)d.hr=v;if(m===1&&v&&fr){d.sys=v;d.dia=fr}if(m===2&&v)d.spo2=v}
 if(Object.keys(d).length){rawPush('MEASUREMENT',{decoded:{...d}});addLive(d,'R10M_YCBT')}
 if(type===2&&c===0&&p.length>=6){
  bleBattery=p[5];bleFirmware=p[3]+'.'+String(p[2]).padStart(2,'0');rawPush('DEVICE_INFO',{battery:bleBattery,firmware:bleFirmware});
  const batteryEl=document.getElementById('battery'),connEl=document.getElementById('conn');if(batteryEl)batteryEl.textContent=bleBattery;
  if(connEl){connEl.textContent='● R10M YCBT conectado · FW '+bleFirmware;connEl.classList.add('ok');refreshConnectionUI()}
 }
};

protocolProbe=async function(k){
 const st=document.getElementById('protocolState');if(!yCmd){st.textContent='Conectá primero el R10M YCBT.';return}
 protocolCapture={active:true,node:k,started:new Date().toISOString(),frames:[]};startRawTest('PROTOCOL_'+k.toUpperCase());
 st.textContent='Sondeando '+k.toUpperCase()+' · RAW global activo…';autoLog('PROTOCOL '+k+' START');
 try{
  await ysend(2,1,[0x47,0x46]);await new Promise(r=>setTimeout(r,700));await ysend(2,0x1b,[]);await new Promise(r=>setTimeout(r,700));await ysend(2,3,[0x47,0x50]);
  setTimeout(()=>{protocolCapture.active=false;stopRawTest();st.textContent=`${k.toUpperCase()}: ${protocolCapture.frames.length} tramas locales · ${rawSession.events.length} eventos RAW totales.`;autoLog('PROTOCOL '+k+' END frames='+protocolCapture.frames.length)},5000);
 }catch(e){protocolCapture.active=false;stopRawTest();st.textContent='Error '+k+': '+e.message}
};

(function(){
 const st=document.getElementById('protocolState'),host=st?.previousElementSibling;if(!st||!host)return;
 const add=(id,text,cls,fn)=>{if(document.getElementById(id))return;const b=document.createElement('button');b.id=id;b.className='btn '+cls;b.textContent=text;b.onclick=fn;host.appendChild(b)};
 add('rawMarkerBtn','＋ MARCADOR','green',promptRawMarker);
 add('rawTestBtn','▶ CAPTURA MANUAL','purple',function(){
  if(activeRawTest){stopRawTest();this.textContent='▶ CAPTURA MANUAL';st.textContent='Captura manual detenida.'}
  else{const n=prompt('Nombre de captura (ej. PASOS_7301, SPO2_98):','PASOS');if(!n)return;startRawTest(n);this.textContent='■ DETENER CAPTURA';st.textContent='Captura manual '+n+' activa.'}
 });
 add('rawClearBtn','LIMPIAR RAW','red',clearRawSession);
 st.textContent='v14.8 RAW Recorder activo · registra TX, RX CMD, RX STREAM y DECODE de toda la sesión.';
 document.title='FITRING / MAR v14.8 RAW RECORDER';
 const brand=document.querySelector('.brand');if(brand)brand.innerHTML='◉ FITRING / <b>MAR</b> v14.8';
 const footer=document.querySelector('.footer');if(footer)footer.textContent='FITRING / MAR v14.8 RAW RECORDER · captura BLE global TX/RX/DECODE + Protocol Lab + AutoScan.';
 rawPush('RECORDER_READY',{version:FITRING_VERSION});
})();
</script>
