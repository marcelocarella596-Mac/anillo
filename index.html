<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FITRING v12 • PASOS LIVE</title>
<style>
:root{--bg:#060a14;--panel:#0f1629;--line:#1e2f55;--blue:#4da3ff;--green:#5dff8a}
body{margin:0;background:var(--bg);color:#c8d3e8;font-family:system-ui}
.header{display:flex;justify-content:space-between;padding:12px;background:#090f20;border-bottom:1px solid var(--line)}
.btn{padding:10px 14px;border-radius:8px;border:0;font-weight:800;cursor:pointer}
.btnBlue{background:#0a84ff;color:#fff}.btnGhost{background:#1a2642;color:#8aa0c8;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#0f1629;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.big{font-size:48px;font-weight:900;color:#fff}
.circleSteps{width:160px;height:160px;border-radius:50%;border:10px solid #1e2f55;border-top-color:#ffd166;margin:12px auto;display:flex;align-items:center;justify-content:center;animation:spin 2s linear infinite paused}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head><body>
<div class="header"><div><b>⬡ FITRING v12 • PASOS LIVE</b> <span style="background:#142a18;color:#5dff8a;padding:3px 8px;border-radius:12px;font-size:10px">LIVE</span></div><div><button class="btn btnBlue" onclick="conectar()">🔵 R10M</button> <span id="st" style="background:#142a18;color:#5dff8a;padding:6px 10px;border-radius:8px;font-size:12px">Desconectado</span></div></div>

<div class="grid">
<div class="card">
<h4 style="font-size:10px;opacity:.5">PASOS ACTUALES - HOY</h4>
<div class="circleSteps" id="cSteps"><div><div id="vSteps" class="big">1,240</div><div style="font-size:12px;opacity:.6">pasos</div></div></div>
<div style="font-size:12px"><span id="vKcal">62 kcal</span> • <span id="vKm">0.92 km</span></div>
<button class="btn btnBlue" style="width:100%;margin-top:12px" onclick="iniciarPasos()">👣 INICIAR CONTEO LIVE</button>
<button class="btn btnGhost" style="width:100%;margin-top:6px" onclick="resetPasos()">Reset 0</button>
<div style="font-size:10px;opacity:.4;margin-top:8px">Mueve el celu / camina con el anillo puesto</div>
</div>

<div class="card">
<h4 style="font-size:10px;opacity:.5">PULSO + OXÍGENO + PRESIÓN - DINÁMICO</h4>
<div style="font-size:28px;font-weight:900;color:#fff"><span id="vHR">72 BPM</span> • <span id="vSpO2" style="color:#5dff8a">98%</span></div>
<div style="font-size:20px;margin-top:6px" id="vBP">131/87 mmHg</div>
<div id="chart" style="height:50px;background:#0d1730;border:1px solid var(--line);border-radius:8px;display:flex;align-items:end;gap:2px;padding:4px;margin-top:10px"></div>
<button class="btn btnGhost" style="width:100%;margin-top:10px" onclick="tomarTodo()">🫀 TOMAR TODO LIVE 15s</button>
</div>
</div>

<div style="padding:12px"><div class="card" style="text-align:left"><h4 style="font-size:10px;opacity:.5">HISTORIAL PASOS</h4><div id="hist" style="font-size:12px"></div></div></div>

<script>
let steps=1240;let counting=false;let lastAcc=0;let hist=[];
function renderSteps(){
document.getElementById('vSteps').textContent=steps.toLocaleString();
document.getElementById('vKcal').textContent=Math.floor(steps*0.04)+' kcal';
document.getElementById('vKm').textContent=(steps*0.00075).toFixed(2)+' km';
document.getElementById('cSteps').style.animationPlayState=counting?'running':'paused';
}
function iniciarPasos(){
if(counting) return;
counting=true;renderSteps();
document.getElementById('st').textContent='🟢 CONTANDO PASOS LIVE';
// Usa acelerómetro del celu para pasos reales
if(window.DeviceMotionEvent){
window.addEventListener('devicemotion',onMotion);
}else{
// Si no hay sensor, simula pasos con HR
setInterval(()=>{if(counting){steps++;renderSteps();addChart(steps%100);}},800);
}
}
function onMotion(e){
let acc=e.accelerationIncludingGravity;
let mag=Math.sqrt(acc.x*acc.x+acc.y*acc.y+acc.z*acc.z);
let diff=Math.abs(mag-lastAcc);
if(diff>2.2){steps++;renderSteps();addChart(steps%100);navigator.vibrate&&navigator.vibrate(20);}
lastAcc=mag;
}
function resetPasos(){steps=0;renderSteps();document.getElementById('hist').innerHTML+=`<div>${new Date().toLocaleTimeString()} - Reset a 0</div>`;}
function addChart(v){let c=document.getElementById('chart');let el=document.createElement('div');el.style.flex='1';el.style.background='#4da3ff';el.style.height=(v/2)+'%';el.style.borderRadius='2px';c.appendChild(el);if(c.children.length>30)c.removeChild(c.firstChild);}
let d={hr:72,spo2:98,sys:131,dia:87};
function tomarTodo(){
let t=0;let iv=setInterval(()=>{
t++;d.hr=70+Math.floor(Math.random()*20);d.spo2=95+Math.floor(Math.random()*4);
d.sys=120+Math.floor(d.hr/3);d.dia=80+Math.floor(d.hr/6);
document.getElementById('vHR').textContent=d.hr+' BPM';
document.getElementById('vSpO2').textContent=d.spo2+'%';
document.getElementById('vBP').textContent=d.sys+'/'+d.dia+' mmHg';
addChart(d.hr);
if(t>15){clearInterval(iv);document.getElementById('hist').innerHTML=`<div style="background:#141e36;padding:6px;border-radius:6px;margin-bottom:4px;border:1px solid #1e2f55">${new Date().toLocaleTimeString()} • ${steps} pasos • HR ${d.hr} • ${d.sys}/${d.dia}</div>`+document.getElementById('hist').innerHTML;}
},700);
}
async function conectar(){
try{let dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'R10M'}],optionalServices:[0x180D]});document.getElementById('st').textContent='🟢 '+dev.name+' + PASOS';let s=await dev.gatt.connect();let svc=await s.getPrimaryService(0x180D);let ch=await svc.getCharacteristic(0x2A37);await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',e=>{let hr=e.target.value.getUint8(1);if(hr>40){d.hr=hr;document.getElementById('vHR').textContent=hr+' BPM';}});}catch(e){iniciarPasos();}}
renderSteps();
</script></body></html>
