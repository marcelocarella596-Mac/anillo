<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060a14">
<title>FITRING / MAR v11 • TRIPLE TEST</title>

<style>
:root{
  --bg:#060a14;
  --panel:#0e1628;
  --card:#131e35;
  --card2:#0b1324;
  --line:#20304f;
  --text:#dce6f7;
  --muted:#7888a5;
  --blue:#42a5ff;
  --cyan:#25d8d1;
  --green:#5dff8a;
  --orange:#ff9f43;
  --red:#ff626e;
  --yellow:#ffd166;
  --purple:#a56cff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -20%,#17254a 0,#060a14 42%);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  min-height:100vh;
}

button,input,select{font:inherit}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(6,10,20,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px 14px;
}

.headTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:900;
}

.version{
  color:#d4a9ff;
  background:#281b3b;
  padding:3px 8px;
  border-radius:20px;
  font-size:9px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 11px;
  background:#16213a;
  color:#fff;
  cursor:pointer;
  font-weight:800;
  font-size:11px;
}

.btn.blue{
  background:#087ff5;
  border-color:#168cff;
}

.btn.green{
  background:#123d25;
  border-color:#257747;
  color:var(--green);
}

.btn.purple{
  background:#281d43;
  border-color:#6942a5;
}

.btn.red{
  background:#3a161c;
  border-color:#7c2834;
  color:#ff9da6;
}

.statusbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:10px;
}

.pill{
  background:#101a2e;
  border:1px solid var(--line);
  padding:5px 9px;
  border-radius:20px;
}

.dot{
  width:7px;
  height:7px;
  display:inline-block;
  border-radius:50%;
  background:var(--green);
  margin-right:4px;
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  padding:10px 12px;
  max-width:1200px;
  margin:auto;
}

.nav button{
  border:1px solid var(--line);
  background:#0d1628;
  color:#91a0ba;
  border-radius:11px;
  padding:10px 4px;
  font-weight:800;
  cursor:pointer;
}

.nav button.active{
  color:#fff;
  border-color:var(--blue);
  background:#142646;
  box-shadow:0 0 20px #1787ff22;
}

main{
  max-width:1200px;
  margin:auto;
  padding:0 12px 40px;
}

.page{display:none}
.page.active{display:block}

.hero{
  background:linear-gradient(135deg,#101b31,#10182a);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.heroTitle{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.hero h1{
  margin:0;
  font-size:20px;
}

.sub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.modeTag{
  padding:5px 9px;
  border-radius:20px;
  font-size:9px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.metric{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px;
  min-height:125px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.metric.priority{
  border-color:#368ee9;
  box-shadow:0 0 18px #2088ff18;
}

.metric .label{
  color:#91a0ba;
  font-size:10px;
  font-weight:800;
}

.metric .value{
  font-size:27px;
  font-weight:950;
  margin:8px 0 2px;
}

.metric .unit{
  font-size:11px;
  color:#9ba9bf;
}

.source{
  position:absolute;
  right:8px;
  top:8px;
  font-size:8px;
  padding:3px 6px;
  border-radius:8px;
  background:#202a3d;
  color:#9aa8bd;
}

.source.real{
  background:#113c28;
  color:var(--green);
}

.source.demo{
  background:#392a13;
  color:var(--yellow);
}

.source.none{
  background:#252a36;
  color:#8994a8;
}

.bar{
  height:5px;
  border-radius:10px;
  background:#081126;
  margin-top:9px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:var(--blue);
  transition:.4s;
}

.small{
  color:var(--muted);
  font-size:9px;
  margin-top:7px;
}

.section{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-top:12px;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  gap:10px;
}

.sectionTitle b{font-size:13px}

.triple{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.modeCard{
  border:1px solid var(--line);
  background:#0c1528;
  border-radius:15px;
  padding:14px;
  cursor:pointer;
}

.modeCard:hover{
  border-color:var(--blue);
}

.modeCard h3{
  margin:0 0 4px;
}

.modeCard .big{
  font-size:24px;
  font-weight:950;
  margin-top:12px;
}

.chart{
  height:120px;
  display:flex;
  align-items:flex-end;
  gap:3px;
  background:#091224;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
  overflow:hidden;
}

.chart div{
  flex:1;
  min-width:3px;
  background:linear-gradient(var(--cyan),var(--blue));
  border-radius:3px 3px 0 0;
}

.session{
  text-align:center;
  padding:20px 10px;
  background:radial-gradient(circle,#18334b,#0b1426 65%);
  border:1px solid var(--line);
  border-radius:18px;
}

.breathCircle{
  width:145px;
  height:145px;
  margin:14px auto;
  border:3px solid var(--cyan);
  border-radius:50%;
  display:grid;
  place-items:center;
  box-shadow:0 0 35px #25d8d126;
  transition:transform 4s ease;
}

.breathCircle.inhale{
  transform:scale(1.16);
}

.breathCircle.exhale{
  transform:scale(.82);
}

.b
