<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FITRING - Smart Ring Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--card:#17171a;--card2:#222226;--accent:#E8D44D;--accent2:#00ff88;--text:#fff;--muted:#9a9aa0;--border:#2a2a2e}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px;-webkit-font-smoothing:antialiased}
.header{padding:18px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(10,10,11,.92);backdrop-filter:blur(20px);z-index:10;border-bottom:1px solid var(--border)}
.logo{font-weight:900;letter-spacing:3px;font-size:18px}
.badge{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1px}
.ring{display:flex;gap:8px;align-items:center;background:var(--card);padding:6px 12px;border-radius:20px;border:1px solid var(--border)}
.dot{width:8px;height:8px;background:var(--accent2);border-radius:50%;box-shadow:0 0 10px var(--accent2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.readiness{margin:16px;background:var(--card);border-radius:24px;padding:20px;border:1px solid var(--border);text-align:center}
.circle-wrap{width:110px;height:110px;margin:0 auto 12px;position:relative;border-radius:50%;background:conic-gradient(var(--accent) 82%, #222 0);padding:4px}
.circle-in{width:100%;height:100%;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.m-card{background:linear-gradient(145deg,var(--card),var(--card2));border-radius:20px;padding:14px;border:1px solid var(--border)}
.m-card h4{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
.m-card .val{font-size:22px;font-weight:900}.m-card .sub{font-size:10px;color:var(--accent2);margin-top:4px}
.tabs{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{width:calc(100% - 32px);margin:0 16px 12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:#fff;outline:none}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.ex-card{background:var(--card);border-radius:18px;padding:10px;border:1px solid var(--border);position:relative;cursor:pointer}
.ex-card img{width:100%;height:96px;object-fit:cover;border-radius:12px;background:#222}
.ex-card h3{font-size:11px;margin:8px 0 2px;text-transform:uppercase;font-weight:800}
.ex-card p{font-size:9px;color:var(--muted)}
.add-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;background:var(--accent);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.builder{margin:16px;background:var(--card);border-radius:24px;padding:16px;border:1px dashed #333}
